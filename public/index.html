<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a0f6b" />
  <title>Cartoon Clash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="rays"></div>
    <svg class="doodles" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".18">
        <path class="d1" d="M90 120 l10 22 24 3 -18 16 5 24 -21 -12 -21 12 5 -24 -18 -16 24 -3z" />
        <path class="d2" d="M1080 160 q20 -30 40 0 t40 0" />
        <circle class="d3" cx="1010" cy="640" r="26" />
        <path class="d1" d="M160 660 q25 -30 50 0 t50 0 t50 0" />
        <path class="d2" d="M620 70 l8 16 18 2 -13 12 4 18 -17 -9 -17 9 4 -18 -13 -12 18 -2z" />
        <circle class="d3" cx="300" cy="380" r="12" />
        <path class="d1" d="M1130 420 l14 0 m-7 -7 l0 14" />
        <path class="d2" d="M60 420 l14 0 m-7 -7 l0 14" />
      </g>
    </svg>
  </div>

  <header class="topbar">
    <div class="logo-mini" id="logoMini"><span>Cartoon</span> <span>Clash</span></div>
    <div class="top-actions">
      <label class="pill lang-pill">
        <span class="pill-ic" id="globeIc"></span>
        <select id="langSelect" aria-label="Language">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
      <button class="pill icon-only" id="soundBtn" aria-label="Son"></button>
    </div>
  </header>

  <main id="app">
    <!-- ============ ACCUEIL ============ -->
    <section id="screen-home" class="screen">
      <div class="hero">
        <div class="hero-mascot">
          <div class="speech" data-i18n="heroBubble"></div>
          <div id="heroMascot"></div>
        </div>
        <h1 class="logo" aria-label="Cartoon Clash">
          <span class="logo-line l1"><span>C</span><span>A</span><span>R</span><span>T</span><span>O</span><span>O</span><span>N</span></span>
          <span class="logo-line l2"><span>C</span><span>L</span><span>A</span><span>S</span><span>H</span><span class="bang">!</span></span>
        </h1>
        <p class="ribbon"><span data-i18n="tagline"></span></p>
      </div>

      <div class="home-grid">
        <section class="card profile-card pop">
          <h2 class="card-title"><span class="t-ic" data-icon="smile"></span><span data-i18n="profile"></span></h2>
          <div class="avatar-stage">
            <div class="avatar-halo"></div>
            <button id="avatarBtn" class="avatar xl wobble-hover" aria-label="avatar"></button>
            <button id="openAvatars" class="edit-badge" aria-label="edit" data-icon="pen"></button>
          </div>
          <div class="avatar-name" id="avatarName"></div>
          <div class="quick-avatars" id="quickAvatars"></div>
          <label for="nameInput" class="field-label" data-i18n="nickname"></label>
          <div class="input-wrap">
            <span class="input-ic" data-icon="pen"></span>
            <input id="nameInput" maxlength="20" autocomplete="off" data-i18n-ph="nicknamePh" />
          </div>
        </section>

        <section class="card play-card pop" style="--d: 80ms">
          <h2 class="card-title"><span class="t-ic" data-icon="dice"></span><span data-i18n="mode"></span></h2>
          <div class="universes" id="universePicker">
            <button class="universe" data-universe="cartoon"><span class="uni-art" data-icon="tv"></span><span data-i18n="uniCartoon"></span></button>
            <button class="universe" data-universe="manga"><span class="uni-art" data-icon="manga"></span><span data-i18n="uniManga"></span></button>
          </div>
          <div class="modes" id="modePicker">
            <button class="mode mode-most" data-mode="most">
              <span class="mode-art" data-icon="trophy"></span>
              <span class="mode-txt"><strong data-i18n="modeMost"></strong><small data-i18n="modeMostDesc"></small></span>
              <span class="mode-check" data-icon="check"></span>
            </button>
            <button class="mode mode-least" data-mode="least">
              <span class="mode-art" data-icon="flip"></span>
              <span class="mode-txt"><strong data-i18n="modeLeast"></strong><small data-i18n="modeLeastDesc"></small></span>
              <span class="mode-check" data-icon="check"></span>
            </button>
          </div>
          <button id="createBtn" class="btn btn-primary btn-xl"><span data-icon="play"></span><span data-i18n="createRoom"></span></button>
          <div class="or"><span data-i18n="or"></span></div>
          <div class="join-row">
            <input id="codeInput" maxlength="4" autocomplete="off" data-i18n-ph="codePh" aria-label="code" />
            <button id="joinBtn" class="btn btn-blue"><span data-i18n="joinRoom"></span><span data-icon="arrow"></span></button>
          </div>
        </section>
      </div>

      <section class="how">
        <h2 class="how-title" data-i18n="howTitle"></h2>
        <div class="how-steps">
          <div class="how-step pop" style="--d: 120ms"><span class="how-num">1</span><span class="how-ic" data-icon="bubble"></span><p data-i18n="how1"></p></div>
          <div class="how-step pop" style="--d: 200ms"><span class="how-num">2</span><span class="how-ic" data-icon="pen"></span><p data-i18n="how2"></p></div>
          <div class="how-step pop" style="--d: 280ms"><span class="how-num">3</span><span class="how-ic" data-icon="gavel"></span><p data-i18n="how3"></p></div>
          <div class="how-step pop" style="--d: 360ms"><span class="how-num">4</span><span class="how-ic" data-icon="trophy"></span><p data-i18n="how4"></p></div>
        </div>
      </section>
    </section>

    <!-- ============ SALON ============ -->
    <section id="screen-lobby" class="screen hidden">
      <div class="lobby-grid">
        <section class="card pop">
          <div class="ticket">
            <span class="ticket-label" data-i18n="roomCode"></span>
            <div id="roomCode" class="ticket-code"></div>
            <button id="copyLink" class="btn btn-yellow btn-sm"><span data-icon="copy"></span><span data-i18n="copyLink"></span></button>
          </div>
          <h2 class="card-title"><span class="t-ic" data-icon="users"></span><span data-i18n="players"></span> <span class="count-badge" id="playerCount"></span></h2>
          <ul id="lobbyPlayers" class="seats"></ul>
        </section>
        <section class="card pop" style="--d: 80ms">
          <h2 class="card-title"><span class="t-ic" data-icon="sparkle"></span><span data-i18n="settings"></span></h2>
          <div class="setting">
            <span class="setting-label"><span data-icon="tv"></span><span data-i18n="universe"></span></span>
            <div class="seg" id="universeSeg">
              <button data-v="cartoon"><span data-icon="tv"></span><span data-i18n="uniCartoon"></span></button>
              <button data-v="manga"><span data-icon="manga"></span><span data-i18n="uniManga"></span></button>
            </div>
          </div>
          <div class="setting">
            <span class="setting-label"><span data-icon="dice"></span><span data-i18n="mode"></span></span>
            <div class="seg" id="modeSeg">
              <button data-v="most"><span data-icon="trophy"></span><span data-i18n="modeMost"></span></button>
              <button data-v="least"><span data-icon="flip"></span><span data-i18n="modeLeast"></span></button>
            </div>
          </div>
          <div class="setting">
            <span class="setting-label"><span data-icon="layers"></span><span data-i18n="rounds"></span></span>
            <div class="seg" id="roundsSeg"><button data-v="3">3</button><button data-v="5">5</button><button data-v="10">10</button></div>
          </div>
          <div class="setting">
            <span class="setting-label"><span data-icon="clock"></span><span data-i18n="timer"></span></span>
            <div class="seg" id="timerSeg"><button data-v="30">30s</button><button data-v="60">60s</button><button data-v="90">90s</button></div>
          </div>
          <div class="setting">
            <span class="setting-label"><span data-icon="globe"></span><span data-i18n="aiLanguage"></span></span>
            <div class="seg" id="aiLangSeg"><button data-v="fr">FR</button><button data-v="en">EN</button><button data-v="es">ES</button></div>
          </div>
          <p id="lobbyHint" class="hint"></p>
          <button id="startBtn" class="btn btn-primary btn-xl pulse"><span data-icon="play"></span><span data-i18n="start"></span></button>
          <button class="btn btn-ghost btn-sm leaveBtn"><span data-icon="door"></span><span data-i18n="leave"></span></button>
        </section>
      </div>
    </section>

    <!-- ============ MANCHE ============ -->
    <section id="screen-playing" class="screen hidden">
      <div class="round-head">
        <span class="pill pill-dark"><span data-icon="layers"></span><span data-i18n="round"></span>&nbsp;<b class="roundNum"></b></span>
        <span class="pill pill-uni uniLabel"></span>
        <span class="pill pill-mode modeLabel"></span>
      </div>
      <div class="theme-stage">
        <div class="timer-ring" id="timerRing">
          <svg viewBox="0 0 64 64"><circle class="tr-bg" cx="32" cy="32" r="27" /><circle class="tr-fg" id="timerArc" cx="32" cy="32" r="27" /></svg>
          <span id="timerText"></span>
        </div>
        <div class="theme-card" id="themeCard">
          <span class="theme-tag" data-i18n="themeLabel"></span>
          <h1 class="theme" id="themeText"></h1>
        </div>
      </div>

      <div class="card answer-card">
        <form id="answerForm">
          <label for="answerInput" class="field-label" id="answerLabel"></label>
          <div class="answer-row">
            <div class="input-wrap big">
              <span class="input-ic" data-icon="pen"></span>
              <input id="answerInput" maxlength="60" autocomplete="off" />
            </div>
            <button class="btn btn-primary btn-lg"><span data-icon="check"></span><span data-i18n="submit"></span></button>
          </div>
        </form>
        <div id="submittedBox" class="submitted hidden">
          <div class="stamp"><span data-icon="check"></span><span data-i18n="submittedTitle"></span></div>
          <p class="my-answer" id="myAnswer"></p>
          <p class="hint" data-i18n="submitted"></p>
          <button id="changeBtn" class="btn btn-ghost btn-sm"><span data-icon="pen"></span><span data-i18n="changeAnswer"></span></button>
        </div>
      </div>
      <ul id="playingPlayers" class="mini-players"></ul>
    </section>

    <!-- ============ DÉLIBÉRATION ============ -->
    <section id="screen-judging" class="screen hidden">
      <div class="judging">
        <div class="thought"><span>?</span><span>!</span><span>?</span></div>
        <div id="judgeMascot" class="judge-mascot"></div>
        <h1 class="big-title" data-i18n="judging"></h1>
        <p class="sub" data-i18n="judgingSub"></p>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </section>

    <!-- ============ RÉSULTATS DE MANCHE ============ -->
    <section id="screen-results" class="screen hidden">
      <div class="round-head">
        <span class="pill pill-dark"><span data-icon="gavel"></span><span data-i18n="roundResults"></span>&nbsp;<b class="roundNum"></b></span>
        <span class="pill pill-uni uniLabel"></span>
        <span class="pill pill-mode modeLabel"></span>
      </div>
      <div class="theme-card small">
        <span class="theme-tag" data-i18n="themeLabel"></span>
        <h2 class="theme" id="resultsTheme"></h2>
      </div>
      <div class="verdict">
        <div class="verdict-owl" id="verdictMascot"></div>
        <div class="verdict-bubble">
          <span class="verdict-name" data-i18n="judgeName"></span>
          <p id="resultsSummary"></p>
        </div>
      </div>
      <p id="resultsNotice" class="notice hidden"></p>
      <ol id="resultsList" class="results"></ol>
      <div class="results-actions">
        <button id="nextBtn" class="btn btn-primary btn-xl"></button>
        <p id="waitingNext" class="hint light" data-i18n="waitingNext"></p>
      </div>
    </section>

    <!-- ============ CLASSEMENT FINAL ============ -->
    <section id="screen-final" class="screen hidden">
      <h1 class="big-title final-title" data-i18n="final"></h1>
      <div id="podium" class="podium"></div>
      <div class="final-grid">
        <div>
          <div id="bestBox" class="best"></div>
          <ol id="finalList" class="results compact"></ol>
        </div>
        <section class="card">
          <h2 class="card-title"><span class="t-ic" data-icon="layers"></span><span data-i18n="recap"></span></h2>
          <div id="recap" class="recap"></div>
        </section>
      </div>
      <div class="results-actions">
        <button id="againBtn" class="btn btn-primary btn-xl"><span data-icon="refresh"></span><span data-i18n="playAgain"></span></button>
        <p id="waitingAgain" class="hint light" data-i18n="waitingHost"></p>
        <button class="btn btn-ghost btn-sm leaveBtn"><span data-icon="door"></span><span data-i18n="leave"></span></button>
      </div>
    </section>
  </main>

  <!-- Choix de l'avatar -->
  <dialog id="avatarDialog">
    <div class="dialog-head">
      <h2 class="card-title"><span class="t-ic" data-icon="smile"></span><span data-i18n="chooseAvatar"></span></h2>
      <button id="closeAvatars" class="round-btn" aria-label="close"><span data-icon="close"></span></button>
    </div>
    <div id="avatarGrid" class="avatar-grid"></div>
    <label class="btn btn-blue upload">
      <span data-icon="camera"></span><span data-i18n="uploadPhoto"></span>
      <input type="file" id="photoInput" accept="image/*" hidden />
    </label>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="avatars.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
